name: Actualizar datos nivel río Calamar

on:
  schedule:
    - cron: "37 2,14,20 * * *"  # diario a las 21:37, 09:37 y 15:37 en Colombia (tras publicación IDEAM)
  workflow_dispatch:          # ejecución manual desde la pestaña Actions

permissions:
  contents: write             # necesario para hacer push del CSV, FEWS y su versión de fuente

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar Chromium para Playwright
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar scraper IDEAM
        env:
          IDEAM_DHIME_ACCEPT_TERMS: "true"
        run: python scraper_ideam.py

      - name: Actualizar caché FEWS IDEAM para GitHub Pages
        continue-on-error: true
        run: node scripts/update-fews.mjs

      - name: Evaluar y enviar avisos push (VAPID)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python enviar_push.py

      - name: Commit y push si cambiaron los datos
        run: |
          if [ -n "$(git status --porcelain -- nivel_calamar.csv nivel_calamar_fuente.json assets/fews_calamar.json docs/assets/nivel_calamar.csv docs/assets/fews_calamar.json docs/assets/config_alertas.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- nivel_calamar.csv
            if [ -f nivel_calamar_fuente.json ]; then
              git add -- nivel_calamar_fuente.json
            fi
            if [ -f assets/fews_calamar.json ]; then
              git add -- assets/fews_calamar.json
            fi
            if [ -d docs/assets ]; then
              git add -- docs/assets/nivel_calamar.csv docs/assets/fews_calamar.json
              if [ -f docs/assets/config_alertas.json ]; then
                git add -- docs/assets/config_alertas.json
              fi
            fi
            git commit -m "Actualización automática nivel Calamar $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "Datos y versión IDEAM sin cambios; no se hace commit."
          fi
