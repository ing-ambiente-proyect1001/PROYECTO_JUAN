name: Actualizar datos FEWS IDEAM

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # cada 15 min fuera de picos :00/:15/:30/:45 para evitar omisiones de GitHub
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-fews
  cancel-in-progress: false

jobs:
  actualizar-fews:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Python 3.11 y dependencias push
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar pywebpush y requests
        continue-on-error: true
        run: pip install "pywebpush>=2.0.0" "requests>=2.31"

      - name: Actualizar serie FEWS IDEAM
        run: node scripts/update-fews.mjs

      - name: Evaluar y enviar avisos push (VAPID)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python enviar_push.py

      - name: Commit y push si cambió fews_calamar.json
        run: |
          if [ -n "$(git status --porcelain -- assets/fews_calamar.json docs/assets/fews_calamar.json docs/assets/config_alertas.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- assets/fews_calamar.json
            if [ -d docs/assets ]; then
              git add -- docs/assets/fews_calamar.json
              if [ -f docs/assets/config_alertas.json ]; then
                git add -- docs/assets/config_alertas.json
              fi
            fi
            git commit -m "Actualización FEWS Calamar $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "FEWS sin cambios; no se hace commit."
          fi
